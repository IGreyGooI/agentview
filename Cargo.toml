[package]
name = "agentview"
version = "0.1.0"
edition = "2021"
description = "AI/AX runtime: Agent Interface plus Agent Experience for language agents"
license = "MIT"
exclude = [
    "/.claude/**",
    "/CHATROOM.md",
    "/docs/frame-driven-runtime-review.md",
]

[workspace]
members = [".", "agentview-derive"]
resolver = "2"

[features]
default = ["legacy-provider-port"]
legacy-provider-port = []

[dependencies]
agentview-derive = { version = "0.1.0", path = "agentview-derive" }
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
hmac = "0.12"
anyhow = "1"
tracing = "0.1"
minijinja = "2"
ecow = { version = "0.2", features = ["serde"] }
async-trait = "0.1"
async-openai = { version = "=0.41.3", default-features = false, features = ["responses", "byot", "rustls"] }
futures = "0.3"
eventsource-stream = "0.2"
getrandom = "0.3"
thiserror = "2"
nom = "8"
quick-xml = "0.41.0"
chess = "3.2"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
axum = "0.8"

[[test]]
name = "minimal_component"
path = "tests/target_api/minimal_component.rs"
required-features = ["legacy-provider-port"]

[[example]]
name = "signal_reaction"
path = "examples/signal_reaction.rs"

[[example]]
name = "component_runtime_visual_acceptance"
path = "examples/component_runtime_visual_acceptance.rs"

[[example]]
name = "chess_agentview"
path = "examples/chess_agentview/main.rs"

[[example]]
name = "chess_agentview_live_acceptance"
path = "examples/chess_agentview_live_acceptance/main.rs"
