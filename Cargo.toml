[package]
name = "agentview"
version = "0.1.0"
edition = "2021"
description = "AI/AX runtime: Agent Interface plus Agent Experience for language agents"
license = "MIT"

[workspace]
members = [".", "agentview-derive"]
resolver = "2"

[features]
default = ["openrouter"]
openrouter = []
# Retains the pre-mounted component compiler and its raw `View` IR for
# migration tests and isolated compatibility examples. It is deliberately not
# part of the ordinary component-authoring surface.
raw-component-ir = []

[dependencies]
agentview-derive = { path = "agentview-derive" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
minijinja = "2"
ecow = { version = "0.2", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
nom = "8"
chess = "3.2"

[dev-dependencies]
rig-core = "0.35"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"

[[example]]
name = "pom_mount_plan"
required-features = ["raw-component-ir"]

[[example]]
name = "pom_mounted_streaming"
required-features = ["raw-component-ir"]

[[example]]
name = "pom_provider_tools"
required-features = ["raw-component-ir"]

[[example]]
name = "pom_streaming_channels"
required-features = ["raw-component-ir"]

[[test]]
name = "component"
required-features = ["raw-component-ir"]

[[test]]
name = "component_agent"
required-features = ["raw-component-ir"]

[[test]]
name = "component_compile_fail"
required-features = ["raw-component-ir"]

[[test]]
name = "component_lifecycle"
required-features = ["raw-component-ir"]

[[test]]
name = "component_mounted_streaming"
required-features = ["raw-component-ir"]

[[test]]
name = "component_provider_dispatch"
required-features = ["raw-component-ir"]

[[test]]
name = "component_provision"
required-features = ["raw-component-ir"]

[[test]]
name = "component_streaming"
required-features = ["raw-component-ir"]
